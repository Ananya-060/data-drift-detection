services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ddis
      POSTGRES_USER: ddis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddis_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddis -d ddis"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ddis:${POSTGRES_PASSWORD:-ddis_local_only}@db:5432/ddis
      DATASET_PATH: /data/accepted_2007_to_2018Q4.csv
      MODEL_PATH: /models/ddis_model.joblib
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_TO: ${GMAIL_TO:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data:ro
      - model_data:/models
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  model_data:
